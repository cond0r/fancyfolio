name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://fancyfolio_owner:ci-owner-password-not-secret@127.0.0.1:5432/fancyfolio_test
      FF_APP_PASSWORD: ci-app-password-not-secret-000000
      FF_AUTH_PASSWORD: ci-auth-password-not-secret-00000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
      - run: echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
      - run: sudo apt-get install -y postgresql-17
      - run: sudo pg_createcluster 17 ci --port 5432 --start
      - run: >-
          sudo -u postgres psql -v ON_ERROR_STOP=1
          -c "create role fancyfolio_owner login nosuperuser createdb createrole bypassrls password 'ci-owner-password-not-secret'"
          -c "create role anon nologin noinherit"
          -c "create role authenticated nologin noinherit"
          -c "create role service_role nologin noinherit bypassrls"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - run: pnpm e2e

  bun:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: bun --bun run test --project '!db'
